x-n8n-image: &n8n-image ${N8N_IMAGE:-n8nio/n8n:2.39.2}
x-runners-image: &runners-image ${N8N_RUNNERS_IMAGE:-n8nio/runners:2.39.2}

# ============ blocos reutilizados ============
x-n8n-common-env: &n8n-common-env
  N8N_PROTOCOL: https
  N8N_HOST: ${N8N_HOST}
  N8N_PROXY_HOPS: '1'
  NODE_ENV: production
  NODE_FUNCTION_ALLOW_BUILTIN: zlib
  N8N_LICENSE_UNLOCK_ALL: 'true'
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  WEBHOOK_URL: https://${N8N_HOST}/
  GENERIC_TIMEZONE: America/Sao_Paulo
  TZ: America/Sao_Paulo
  N8N_RELEASE_TYPE: beta
  # ---- banco (serviço postgres desta stack) ----
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: '5432'
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  # ---- dados de execução ----
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: all # desligar por workflow nos pesados (Settings do workflow)
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
  EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'true'
  EXECUTIONS_DATA_PRUNE: 'true'
  EXECUTIONS_DATA_MAX_AGE: '168' # 7 dias
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: '500000' # teto de linhas
  EXECUTIONS_TIMEOUT: '3600' # nenhuma execução segura um slot > 1 h
  EXECUTIONS_TIMEOUT_MAX: '7200' # por workflow pode subir até 2 h
  # ---- fila (serviço redis desta stack) ----
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: '6379'
  QUEUE_BULL_REDIS_DB: '0' # redis dedicado, não precisa isolar por DB
  QUEUE_HEALTH_CHECK_ACTIVE: 'true'
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: 'true'
  QUEUE_WORKER_LOCK_DURATION: '300000' # lease de 5 min (default 60 s)
  QUEUE_WORKER_LOCK_RENEW_TIME: '30000' # renova a cada 30 s (default 10 s)
  QUEUE_WORKER_STALLED_INTERVAL: '60000' # checa stalled a cada 60 s (default 30 s)
  N8N_GRACEFUL_SHUTDOWN_TIMEOUT: '300' # espera até 5 min pelas execuções ao parar (default 30 s)

x-n8n-worker-env: &n8n-worker-env
  <<: *n8n-common-env
  NODE_OPTIONS: --max-old-space-size=1536 # heap do worker com teto
  DB_POSTGRESDB_POOL_SIZE: '5' # 1 conexão por job (default é 2)
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_MAX_CONCURRENCY: '5'
  N8N_RUNNERS_TASK_TIMEOUT: '300'
  N8N_RUNNERS_HEARTBEAT_INTERVAL: '90' # era 30 s -> "runner became unresponsive"
  N8N_RUNNERS_TASK_REQUEST_TIMEOUT: '120'
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '300'

x-runner-env: &runner-env
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  N8N_RUNNERS_MAX_CONCURRENCY: '5'
  N8N_RUNNERS_TASK_TIMEOUT: '300'
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '300'
  NODE_OPTIONS: --max-old-space-size=768 # heap do runner com teto
  GENERIC_TIMEZONE: America/Sao_Paulo
  TZ: America/Sao_Paulo

x-n8n-healthcheck: &n8n-healthcheck
  test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1']
  interval: 30s
  timeout: 10s
  retries: 6
  start_period: 120s

# workers e runners só sobem depois que banco, fila e main estiverem saudáveis
x-worker-depends-on: &worker-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  n8n:
    condition: service_healthy

# ============ serviços ============
services:
  postgres:
    image: postgres:18-alpine
    container_name: n8n-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'

  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'

  n8n:
    image: *n8n-image
    container_name: n8n
    restart: always
    ports:
      - '5678:5678'
    environment:
      <<: *n8n-common-env
      NODES_EXCLUDE: ''
      NODE_OPTIONS: --max-old-space-size=1536
      DB_POSTGRESDB_POOL_SIZE: '8'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
    healthcheck: *n8n-healthcheck

  n8n-worker-1:
    image: *n8n-image
    container_name: n8n-worker-1
    restart: always
    command: worker --concurrency=5
    environment: *n8n-worker-env
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on: *worker-depends-on
    stop_grace_period: 6m
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
    healthcheck: *n8n-healthcheck

  n8n-worker-2:
    image: *n8n-image
    container_name: n8n-worker-2
    restart: always
    command: worker --concurrency=5
    environment: *n8n-worker-env
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on: *worker-depends-on
    stop_grace_period: 6m
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
    healthcheck: *n8n-healthcheck

  task-runners-1:
    image: *runners-image
    container_name: n8n-task-runners-1
    restart: always
    environment:
      <<: *runner-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-1:5679
    depends_on:
      n8n-worker-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1'

  task-runners-2:
    image: *runners-image
    container_name: n8n-task-runners-2
    restart: always
    environment:
      <<: *runner-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-2:5679
    depends_on:
      n8n-worker-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1'

volumes:
  n8n_data:
  postgres_data:
  redis_data:
